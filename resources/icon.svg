<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a3f" />
      <stop offset="1" stop-color="#0b0f16" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc1ff" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" />
  <rect x="24.5" y="24.5" width="463" height="463" rx="107.5" fill="none" stroke="#5ab0ff" stroke-opacity="0.22" stroke-width="3" />

  <!-- Quadcopter mark, top-down -->
  <g filter="url(#glow)" fill="none" stroke="url(#mark)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- arms -->
    <path d="M196 196 128 128 M316 196 384 128 M196 316 128 384 M316 316 384 384" />
    <!-- rotor hubs -->
    <circle cx="128" cy="128" r="30" />
    <circle cx="384" cy="128" r="30" />
    <circle cx="128" cy="384" r="30" />
    <circle cx="384" cy="384" r="30" />
    <!-- body -->
    <rect x="198" y="198" width="116" height="116" rx="30" />
  </g>
  <circle cx="256" cy="256" r="26" fill="url(#mark)" />
</svg>
