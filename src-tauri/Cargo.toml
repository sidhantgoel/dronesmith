[package]
name = "dronesmith"
version = "1.0.0"
edition = "2021"
description = "GUI tool for servicing DJI drones"
default-run = "dronesmith"

[lib]
name = "dronesmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
once_cell = "1"
parking_lot = "0.12"
libloading = "0.8"
roxmltree = "0.20"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
md5 = "0.7"
flate2 = "1"
regex = "1"
base64 = "0.22"
